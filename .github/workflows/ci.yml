# SmartNationDefense / SESIS-FEDERATION — CI
#
# Nota honesta: este workflow NO se ejecuta localmente (no hay ejecución real de
# GitHub Actions desde aquí); se valida sintáacticamente con yaml.safe_load +
# estructura (grep -nE "^\s+(on|jobs|steps|run|uses|uses:).*" .github/workflows/ci.yml).
# El paso "Pruebas backend" es verdadero y se corre con python -m pytest (sin saltar).
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Py 3.12: requirements.txt tiene wheels cp312 para los deps pesados
      # (torch==2.5.1 — sin wheels de 3.13/3.14+). Satisface "3.12+".
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias backend (requirements.txt + pytest 8.3.4)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install "pytest==8.3.4"

      - name: Pruebas backend (sin saltar)
        run: python -m pytest backend/tests -q

      - name: Lint estático (compileall)
        run: python -m compileall -q backend

      - name: "Lint — bandit (fallback: py_compile — bandit no instalado)"
        run: |
          if command -v bandit >/dev/null 2>&1; then
            bandit -q backend/app/core/security.py
          else
            python -m py_compile backend/app/core/security.py
          fi

      - name: pip check
        run: pip check

      - name: Security gate (validate_all.py equivalent)
        run: python scripts/validate_all.py

      - name: Detectar build frontend (se valida según package.json)
        id: frontend
        run: |
          if [ -f frontend/package.json ] && grep -q '"build"' frontend/package.json; then
            echo "has_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_build=false" >> "$GITHUB_OUTPUT"
          fi

      # Advisory honesto: se ejecuta solo si existe build; no bloquea el CI.
      - name: Build frontend (advisory — continuar aunque falle)
        if: steps.frontend.outputs.has_build == 'true'
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
        continue-on-error: true
