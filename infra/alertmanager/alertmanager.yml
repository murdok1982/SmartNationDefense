global:
  resolve_timeout: 5m

route:
  receiver: sesis-default
  group_by: [alertname, severity, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: sesis-critical
      repeat_interval: 1h

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname, service]

receivers:
  - name: sesis-default
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "${SLACK_CHANNEL}"
        send_resolved: true
        title: "{{ .Status | toUpper }} · {{ .CommonLabels.alertname }}"
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

  - name: sesis-critical
    slack_configs:
      - api_url: "${SLACK_PAGER_WEBHOOK_URL}"
        channel: "${SLACK_CRITICAL_CHANNEL}"
        send_resolved: true
        title: "CRITICAL · {{ .CommonLabels.alertname }}"
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
